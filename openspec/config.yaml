schema: spec-driven

context: |
  Language: en. Artifacts use English headings and RFC 2119 keywords.
  Stack: FastAPI/SQLAlchemy/MySQL backend; React Vite TypeScript frontend; Docker Compose.
  Architecture: Client → Property → Irrigation Area (1 crop type + 1 IoT node). Gateway v2 replaces per-node X-API-Key ingest; see openspec/changes/edge-cloud-gateway-provisioning.
  MVP: ingest, users, visualization. Phase 2 AI/alerts stay behind flags. NDVI is a separate event.
  Testing: project-local pytest and vitest; no workspace-wide test target.

strict_tdd: false

githubCopilot:
  cloudAgent: false

projects:
  - path: backend
    stack: Python 3.13 FastAPI SQLAlchemy
    test_command: uv run pytest
    coverage_command: uv run pytest --cov
    linter: uv run ruff check
    formatter: uv run ruff format
  - path: frontend
    stack: React Vite TypeScript
    test_command: npm test
    coverage_command: npm run test:coverage
    type_checker: npm run typecheck

testing:
  strict_tdd: false
  workspace_test_command: null
  fallback: no workspace-level test command covers every in-scope project
  layers:
    backend:
      unit: pytest
      integration: pytest + httpx
      e2e: null
    frontend:
      unit: vitest
      integration: "@testing-library/react"
      e2e: null

rules:
  proposal:
    - Keep Non-goals explicit; do not expand Phase 2 AI/alerts unless authorized
  specs:
    - Use Given/When/Then
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Document architecture decisions with rationale
  tasks:
    - Group by phase; keep tasks completable in one session
  apply:
    tdd: false
    test_command: ""
    guidelines:
      - Follow existing code patterns
      - Run the matching project-local test command only
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
