name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  edge-cloud-contract:
    name: Edge-cloud v2 contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install contract validator
        run: python -m pip install -r scripts/integration/contract-requirements.txt
      - name: Validate package and frozen v1
        run: python scripts/integration/validate_v2_contract.py
      - name: Contract regression tests
        run: python -m unittest discover -s scripts/integration -p 'test_v2_contract.py'

  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check app tests
      - name: Test (pytest)
        run: uv run pytest -q

  gateway-mysql:
    name: Gateway migrations (MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: issue29_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - name: Empty migration, preservation, constraints and rollback
        env:
          GATEWAY_MYSQL_TEST_URL: mysql+pymysql://root@127.0.0.1:3306/issue29_ci
        run: uv run pytest tests/mysql/test_gateway_migrations.py -q

  frontend:
    name: Frontend (typecheck + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (vitest)
        run: npm run test -- --run
      - name: Build
        run: npm run build
